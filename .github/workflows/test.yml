name: Test on emulator

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.omer.autoedit --project-name auto_edit app
          rm -rf app/test app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml

      - name: Patch Android
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i 's/flutter.minSdkVersion/24/' "$f"; fi
          done

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Force compileSdk 36 for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle << 'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android') && p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF

      - name: Build x86_64 APK for emulator
        working-directory: app
        run: flutter build apk --release --target-platform android-x64 --no-shrink

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: app
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.omer.autoedit.auto_edit -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt
            adb logcat -b crash -d > crash.txt
            adb exec-out screencap -p > screen.png
            echo "=== CRASH BUFFER ==="
            cat crash.txt
            echo "=== RELATED LINES ==="
            grep -E "FATAL|AndroidRuntime|UnsatisfiedLink|ClassNotFound|NoSuchMethod|ffmpeg|unity" logcat.txt | head -60 || true
            echo "=== PROCESS ALIVE? ==="
            adb shell pidof com.omer.autoedit.auto_edit || echo "APP IS NOT RUNNING (crashed)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            app/logcat.txt
            app/crash.txt
            app/screen.png