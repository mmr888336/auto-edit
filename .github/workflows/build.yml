name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.omer.autoedit --project-name auto_edit app
          rm -rf app/test app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml

      - name: Patch Android (internet + minSdk 24 + compileSdk 36)
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/flutter.minSdkVersion/24/' "$f"
              sed -i 's/flutter.compileSdkVersion/36/' "$f"
            fi
          done

      - name: Force compileSdk 36 and Java 17 on all plugins
        run: |
          mkdir -p $HOME/.gradle
          cat << 'EOF' > $HOME/.gradle/init.gradle
          allprojects {
              afterEvaluate { p ->
                  def ext = p.extensions.findByName('android')
                  if (ext != null) {
                      ext.compileSdkVersion(36)
                      ext.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
                      ext.compileOptions.targetCompatibility = JavaVersion.VERSION_17
                  }
              }
          }
          EOF

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Patch unity_ads_plugin for new Flutter
        working-directory: app
        run: |
          F=$(find $HOME/.pub-cache -name UnityAdsPlugin.kt | head -n 1)
          echo "Patching $F"
          perl -0pi -e 's/^import io\.flutter\.plugin\.common\.PluginRegistry\.Registrar\s*\n//m' "$F"
          perl -0pi -e 's/(\@JvmStatic\s*)?fun registerWith\(\s*registrar:\s*(?:PluginRegistry\.)?Registrar\s*\)\s*\{(?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*\}//s' "$F"
          echo "----- patched file -----"
          cat "$F"

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoEdit build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk