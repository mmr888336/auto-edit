name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.omer.autoedit --project-name auto_edit app
          rm -rf app/test app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml
          cat > app/android/app/proguard-rules.pro << 'EOF'
          -keep class androidx.work.** { *; }
          -keep class androidx.room.** { *; }
          -keep class * extends androidx.room.RoomDatabase { *; }
          -keep class androidx.work.impl.WorkDatabase_Impl { *; }
          -keep class com.unity3d.** { *; }
          -keep class com.arthenica.ffmpegkit.** { *; }
          -keep class com.antonkarpenko.ffmpegkit.** { *; }
          -dontwarn com.unity3d.**
          EOF

      - name: Patch Android
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i 's/flutter.minSdkVersion/24/' "$f"; fi
          done
          if [ -f android/app/build.gradle.kts ]; then
            cat >> android/app/build.gradle.kts << 'EOF'

          android {
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles("proguard-rules.pro")
                  }
              }
          }
          EOF
          elif [ -f android/app/build.gradle ]; then
            cat >> android/app/build.gradle << 'EOF'

          android {
              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles 'proguard-rules.pro'
                  }
              }
          }
          EOF
          fi

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Force compileSdk 36 for plugins
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle << 'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android') && p.plugins.hasPlugin('com.android.library')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF

      - name: Build release APK (arm64 only, no shrink)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 --no-shrink

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoEdit build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk