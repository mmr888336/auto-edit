name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        run: |
          flutter create --platforms=android --org com.omer.autoedit --project-name auto_edit app
          rm -rf app/test app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml

      - name: Patch Android
        working-directory: app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then sed -i 's/flutter.minSdkVersion/24/' "$f"; fi
          done

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoEdit build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk