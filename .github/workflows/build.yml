name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android scaffold
        shell: bash
        run: |
          flutter create --platforms=android --org com.omer.autoedit --project-name auto_edit app
          rm -rf app/test app/lib
          cp -r lib app/lib
          cp pubspec.yaml app/pubspec.yaml
      - name: Patch Android manifest and SDK versions
        working-directory: app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<application', permission + '\n    <application', 1)
          content = re.sub(r'android:label="[^"]*"', 'android:label="Wad Alreda Auto Edit"', content, count=1)
          manifest.write_text(content)
          PY

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              # تعديل إصدارات SDK لتكون متوافقة
              sed -i 's/flutter\.minSdkVersion/24/g' "$f"
              sed -i 's/flutter\.compileSdkVersion/34/g' "$f"
              
              # توحيد إصدارات JVM لتصبح 17 بدلاً من 1.8 لحل مشكلة التعارض
              sed -i 's/VERSION_1_8/VERSION_17/g' "$f"
              sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" "$f"
              sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' "$f"
            fi
          done

      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-edit-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AutoEdit build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
